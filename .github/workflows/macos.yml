# Build the macOS app and DMG (packaging/macos/build-dmg.sh) on a
# GitHub-hosted M-series Mac: one universal app, Apple Silicon (arm64) and
# Intel (x86_64, cross-compiled here) joined with lipo. Runs when started by hand (Actions tab →
# "macOS build" → Run workflow) or on a version tag (v0.0.19, …); the DMG is
# attached to the run as an artifact and, for a tag, to that tag's GitHub
# release (created if it doesn't exist yet). Not run on every push: macOS minutes
# on private repositories count against the account's allowance.
name: macOS build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  dmg:
    runs-on: macos-14 # Apple Silicon (arm64)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install librsvg ffmpeg
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Test
        run: cargo test --release
      - name: Build the app and DMG
        run: packaging/macos/build-dmg.sh
      - name: Check both architectures
        run: |
          for bin in arclight-gui arclight; do
            archs="$(lipo -archs dist/Arclight.app/Contents/MacOS/$bin)"
            echo "$bin: $archs"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          done
          arch -arm64 dist/Arclight.app/Contents/MacOS/arclight --version
          # The Intel half runs here only if the runner has Rosetta 2.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 dist/Arclight.app/Contents/MacOS/arclight --version
          else
            echo "No Rosetta on this runner: the Intel half was built and linked, not run."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Arclight-macOS-universal
          path: dist/*.dmg
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # wheels.yml may be creating the same release at the same moment:
          # a failed create is fine as long as the release then exists.
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "Arclight ${tag#v} (alpha)" --latest --notes "See CHANGELOG.md." \
            || true
          gh release view "$tag" >/dev/null 2>&1 || { sleep 10; gh release view "$tag" >/dev/null; }
          gh release upload "$tag" dist/*.dmg --clobber
