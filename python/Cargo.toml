[package]
name = "arclt"
version = "0.13.28"
edition = "2021"
description = "Python bindings (the `arclt` module) for ArclightVFX Compositor"
license = "MIT OR Apache-2.0"

[lib]
name = "_arclt"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
arclight = { path = "..", default-features = false, features = ["gpu"] }
pyo3 = { version = "0.30", features = ["abi3-py310"] }
serde_json = "1"
