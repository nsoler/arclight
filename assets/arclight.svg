<?xml version="1.0" encoding="UTF-8"?>
<!-- Arclight placeholder icon (in development): an arc of light over a
     small node graph, with a "DEV" band. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a3a"/>
      <stop offset="1" stop-color="#11141c"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#fff1c2"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="8" y="8" width="240" height="240" rx="48"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="47.5" fill="none" stroke="#3a4560" stroke-width="1"/>

  <!-- The arc of light. -->
  <ellipse cx="128" cy="92" rx="92" ry="56" fill="url(#glow)"/>
  <path d="M 44 120 A 84 84 0 0 1 212 120" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="128" cy="36" r="9" fill="#fff6dc"/>

  <!-- A node graph beneath it: two inputs into a merge, out to the right. -->
  <path d="M 78 150 C 104 150, 104 176, 128 176 M 78 202 C 104 202, 104 176, 128 176 M 128 176 L 182 176"
        fill="none" stroke="#9aa6c0" stroke-width="5" stroke-linecap="round"/>
  <rect x="64" y="141" width="18" height="18" rx="3" fill="#e9cd3c"/>
  <rect x="64" y="193" width="18" height="18" rx="3" fill="#e9cd3c"/>
  <circle cx="128" cy="176" r="12" fill="#8ce18c"/>
  <circle cx="186" cy="176" r="9" fill="#8ce18c"/>

  <!-- In development. -->
  <rect x="8" y="222" width="240" height="26" fill="#d9534f" clip-path="url(#tile)"/>
  <text x="128" y="241" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="18" font-weight="bold"
        letter-spacing="6" fill="#ffffff" text-anchor="middle">DEV</text>
</svg>
