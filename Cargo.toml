[package]
name = "arclight"
version = "0.14.13"
edition = "2021"
description = "ArclightVFX Compositor — an original node-graph image compositor"
license = "MIT OR Apache-2.0"
# Packages (the arclt sdist bundles this crate) leave out the sample media
# and captures in examples/: nothing compiled reads them.
exclude = ["examples/"]

[lib]
name = "arclight"
path = "src/lib.rs"

[[bin]]
name = "arclight"
path = "src/main.rs"

[[bin]]
name = "arclight-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[features]
default = ["gui", "gpu"]
gui = ["dep:eframe", "dep:rfd", "dep:egui_commonmark", "dep:cpal"]
# GPU acceleration (wgpu compute and rendering; see docs/gpu-plan.md).
# Without it the `gpu` module is a stub that always says "use the CPU".
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
flate2 = "1"
image = "0.25"
exr = "1.73"
tiff = "0.11"
rayon = "1"
libloading = "0.9"
eframe = { version = "0.37.0", optional = true }
rfd = { version = "0.17.2", optional = true }
nalgebra = "0.33"
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names", "extras", "KHR_materials_unlit", "KHR_materials_emissive_strength"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"], optional = true }
# Sound in the GUI's playback (ALSA on Linux: libasound.so.2 at run time).
cpal = { version = "0.18", optional = true }
# The same major version as eframe's, or the types don't match.
wgpu = { version = "30", optional = true }
pollster = { version = "1", optional = true }
bytemuck = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"


[workspace]
members = [".", "plugins/example", "python"]

[dev-dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
# Every WGSL shader is translated to MSL in a test, so one Metal would
# reject fails on Linux first (the version wgpu 30 uses).
naga = { version = "30", features = ["wgsl-in", "msl-out"] }
