[package]
name = "arclight"
version = "0.10.28"
edition = "2021"
description = "Arclight — an original node-graph image compositor"
license = "MIT OR Apache-2.0"
# Packages (the arclt sdist bundles this crate) leave out the sample media
# and captures in examples/: nothing compiled reads them.
exclude = ["examples/"]

[lib]
name = "arclight"
path = "src/lib.rs"

[[bin]]
name = "arclight"
path = "src/main.rs"

[[bin]]
name = "arclight-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:egui_commonmark"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
flate2 = "1"
image = "0.25"
exr = "1.73"
tiff = "0.11"
rayon = "1"
libloading = "0.9"
eframe = { version = "0.37.0", optional = true }
rfd = { version = "0.17.2", optional = true }
nalgebra = "0.33"
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names", "KHR_materials_unlit", "KHR_materials_emissive_strength"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"


[workspace]
members = [".", "plugins/example", "python"]

[dev-dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
